name: "Terraform CI/CD Pipeline"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_REGION: "us-east-1"
      AWS_ENDPOINT_URL: "http://localhost:4566"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Start LocalStack (Community)
        uses: LocalStack/setup-localstack@v0.2.3
        with:
          # Force the community image to bypass the Pro license requirement
          image-tag: 'latest'
          install-awslocal: 'true'
        env:
          # Explicitly set the core image to the open-source version
          LOCALSTACK_IMAGE_NAME: localstack/localstack:latest
          # Bypass the pro check explicitly
          LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT: "1"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
