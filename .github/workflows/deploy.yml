name: "Terraform CI/CD Pipeline"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_REGION: "us-east-1"
      AWS_ENDPOINT_URL: "http://localhost:4566"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Start LocalStack (Token-Free Version)
        run: |
          # Pin to version 3.4.0 to completely bypass the new account requirement
          docker run -d -p 4566:4566 \
            -e SERVICES=s3,dynamodb,ec2,iam,sts \
            -e DEFAULT_REGION=us-east-1 \
            --name localstack localstack/localstack:3.4.0
          
          echo "Waiting for LocalStack to boot..."
          until curl -s http://localhost:4566/_localstack/health | grep -q "\"services\":"; do
            sleep 2
          done
          echo "LocalStack is ready!"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
